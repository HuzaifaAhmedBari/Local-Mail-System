name: mail
mgmt:
  network: mailmgmt
  ipv4-subnet: 172.31.31.0/24
topology:
  defaults:
    kind: linux
    image: ${NODE_IMAGE}
    binds:
      - .:/lab
  nodes:
    r1:
      image: ${FRR_IMAGE}
      binds:
        - ./nodes/frr/r1.conf:/etc/frr/frr.conf
        - ./nodes/frr/daemons:/etc/frr/daemons
        - ./nodes/frr/vtysh.conf:/etc/frr/vtysh.conf
    r2:
      image: ${FRR_IMAGE}
      binds:
        - ./nodes/frr/r2.conf:/etc/frr/frr.conf
        - ./nodes/frr/daemons:/etc/frr/daemons
        - ./nodes/frr/vtysh.conf:/etc/frr/vtysh.conf
    clienta:
      exec:
        - python3 /lab/nodes/start_node.py clienta
    clientb:
      exec:
        - python3 /lab/nodes/start_node.py clientb
    alpha:
      binds:
        - .:/lab
        - ./data/alpha-home:/home
      exec:
        - python3 /lab/nodes/start_node.py alpha
    beta:
      binds:
        - .:/lab
        - ./data/beta-home:/home
      exec:
        - python3 /lab/nodes/start_node.py beta
    dns:
      exec:
        - python3 /lab/nodes/start_node.py dns
    mx2:
      exec:
        - python3 /lab/nodes/start_node.py mx2
    attacker:
      exec:
        - python3 /lab/nodes/start_node.py attacker
    br-alpha:
      kind: bridge
    br-beta:
      kind: bridge
    br-svc:
      kind: bridge
  links:
    - endpoints: ["r1:eth3", "r2:eth2"]
    - endpoints: ["r1:eth1", "br-alpha:p-r1a"]
    - endpoints: ["clienta:eth1", "br-alpha:p-clienta"]
    - endpoints: ["alpha:eth1", "br-alpha:p-alpha"]
    - endpoints: ["r2:eth1", "br-beta:p-r2"]
    - endpoints: ["clientb:eth1", "br-beta:p-clientb"]
    - endpoints: ["beta:eth1", "br-beta:p-beta"]
    - endpoints: ["r1:eth2", "br-svc:p-r1s"]
    - endpoints: ["dns:eth1", "br-svc:p-dns"]
    - endpoints: ["mx2:eth1", "br-svc:p-mx2"]
    - endpoints: ["attacker:eth1", "br-svc:p-attacker"]
